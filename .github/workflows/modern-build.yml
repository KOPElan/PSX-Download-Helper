name: Modern .NET build

on:
  push:
    branches: ["feature/modern-dotnet10", "modern"]
    paths:
      - "Modern/**"
      - ".github/workflows/modern-build.yml"
  pull_request:
    paths:
      - "Modern/**"
      - ".github/workflows/modern-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build modern solution
        run: dotnet build Modern/PSXDownloadHelper.Modern.sln --configuration Release
