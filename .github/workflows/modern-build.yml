name: Modern .NET build

on:
  push:
    branches: ["feature/modern-dotnet10", "modern"]
    paths:
      - "Modern/**"
      - ".github/workflows/modern-build.yml"
  pull_request:
    paths:
      - "Modern/**"
      - ".github/workflows/modern-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build modern solution
        run: dotnet build Modern/PSXDownloadHelper.Modern.sln --configuration Release
      - name: Run modern integration tests
        timeout-minutes: 7
        run: dotnet test Modern/PSXDownloadHelper.Modern.Tests/PSXDownloadHelper.Modern.Tests.csproj --configuration Release --blame-hang-timeout 5m --logger "console;verbosity=detailed"
